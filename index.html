<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#070b14">
<title>CrazyTurk Thumbnail Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#18233b 0,#090e19 40%,#030509 100%);
  color:#fff;
  min-height:100vh;
}
.container{
  width:min(94%,760px);
  margin:auto;
  padding:28px 0 60px;
}
.logo{
  text-align:center;
  font-size:35px;
  font-weight:900;
  letter-spacing:-1px;
}
.logo span{color:#ffc400}
.subtitle{
  text-align:center;
  color:#9ca5b7;
  margin:8px 0 30px;
  font-size:17px;
}
.card{
  background:rgba(17,24,38,.94);
  border:1px solid #303a51;
  border-radius:25px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
}
h2{
  margin:0 0 20px;
  font-size:22px;
}
label{
  display:block;
  color:#b7bfce;
  margin:18px 0 8px;
  font-size:15px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button,.option{
  width:100%;
  min-height:58px;
  border-radius:17px;
  border:1px solid #39445c;
  background:#0b101d;
  color:white;
  font-size:17px;
  font-weight:800;
}
.option.active{
  background:linear-gradient(135deg,#ffb800,#ffe56b);
  color:#090909;
  border:none;
}
.upload{
  border:2px dashed #46516a;
  border-radius:20px;
  padding:28px 15px;
  text-align:center;
  cursor:pointer;
  color:#c1c8d6;
}
.upload strong{
  font-size:20px;
  display:block;
  margin-bottom:7px;
}
.upload small{color:#858fa3}
input[type=file]{display:none}
input[type=text],select{
  width:100%;
  padding:17px;
  border-radius:16px;
  border:1px solid #39445c;
  background:#090e1a;
  color:white;
  font-size:17px;
  outline:none;
}
.rangeWrap{
  display:grid;
  grid-template-columns:1fr 70px;
  gap:12px;
  align-items:center;
}
input[type=range]{width:100%}
.value{
  background:#090e1a;
  border:1px solid #39445c;
  border-radius:12px;
  padding:10px;
  text-align:center;
}
.generate{
  margin-top:23px;
  min-height:68px;
  border:0;
  color:#080808;
  font-size:21px;
  background:linear-gradient(90deg,#ffae00,#ffe765);
  box-shadow:0 10px 30px rgba(255,190,0,.18);
}
canvas{
  width:100%;
  display:block;
  border-radius:18px;
  background:#000;
}
.previewBox{
  overflow:hidden;
  border-radius:20px;
}
.download{
  display:none;
  margin-top:17px;
  background:linear-gradient(90deg,#12d879,#7dffbd);
  color:#03130a;
  border:none;
}
.note{
  color:#8d97aa;
  font-size:13px;
  line-height:1.5;
  margin-top:14px;
}
.colors{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}
.color{
  height:49px;
  border-radius:14px;
  border:2px solid transparent;
}
.color.active{border:3px solid white}
.red{background:linear-gradient(135deg,#ff2020,#750000)}
.yellow{background:linear-gradient(135deg,#ffd600,#ff7200)}
.blue{background:linear-gradient(135deg,#00b7ff,#183cff)}
.purple{background:linear-gradient(135deg,#e72bff,#5716ff)}
.footer{
  text-align:center;
  color:#5f6879;
  font-size:13px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">CRAZY<span>TURK</span></div>
<div class="subtitle">CODM Thumbnail Studio</div>

<div class="card">
<h2>🎮 Kapak Türü</h2>

<div class="row">
<button id="youtube" class="option active">YouTube 16:9</button>
<button id="shorts" class="option">Shorts 9:16</button>
</div>
</div>

<div class="card">
<h2>🖼️ Oyun Görseli</h2>

<label class="upload" for="imageInput">
<strong>＋ Görsel Yükle</strong>
<small>Silah, karakter veya gameplay ekran görüntüsü</small>
</label>

<input id="imageInput" type="file" accept="image/*">

<label>Kapak Yazısı</label>
<input id="title" type="text" value="1 V 4!" placeholder="Örn: 1 V 4!">

<label>Alt Yazı</label>
<input id="subtitleText" type="text" placeholder="Örn: TEK BAŞIMA YARGI!">

<label>Tasarım Rengi</label>

<div class="colors">
<button class="color red active" data-color="red"></button>
<button class="color yellow" data-color="yellow"></button>
<button class="color blue" data-color="blue"></button>
<button class="color purple" data-color="purple"></button>
</div>

<label>Görsel Yakınlaştırma</label>
<div class="rangeWrap">
<input id="zoom" type="range" min="100" max="220" value="115">
<div id="zoomValue" class="value">115%</div>
</div>

<label>Görsel Yatay Konum</label>
<div class="rangeWrap">
<input id="posX" type="range" min="-100" max="100" value="0">
<div id="xValue" class="value">0</div>
</div>

<label>Görsel Dikey Konum</label>
<div class="rangeWrap">
<input id="posY" type="range" min="-100" max="100" value="0">
<div id="yValue" class="value">0</div>
</div>

<button id="generate" class="generate">⚡ KAPAĞI HAZIRLA</button>

<p class="note">
Görsel tamamen telefonunda işlenir. Sunucuya yüklenmez.
</p>

</div>

<div class="card">

<h2>👀 Ön İzleme</h2>

<div class="previewBox">
<canvas id="canvas"></canvas>
</div>

<button id="download" class="download">
⬇️ PNG OLARAK KAYDET
</button>

</div>

<div class="footer">
CrazyTurkCodM • Thumbnail Studio
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const imageInput=document.getElementById("imageInput");
const title=document.getElementById("title");
const subtitleText=document.getElementById("subtitleText");

const youtube=document.getElementById("youtube");
const shorts=document.getElementById("shorts");

const zoom=document.getElementById("zoom");
const posX=document.getElementById("posX");
const posY=document.getElementById("posY");

const zoomValue=document.getElementById("zoomValue");
const xValue=document.getElementById("xValue");
const yValue=document.getElementById("yValue");

let mode="youtube";
let img=null;
let theme="red";

const themes={
 red:{
  main:"#ff2424",
  glow:"#ff0000"
 },
 yellow:{
  main:"#ffd21a",
  glow:"#ff8700"
 },
 blue:{
  main:"#24c8ff",
  glow:"#005cff"
 },
 purple:{
  main:"#d93cff",
  glow:"#691cff"
 }
};

youtube.onclick=()=>{
 mode="youtube";
 youtube.classList.add("active");
 shorts.classList.remove("active");
 draw();
};

shorts.onclick=()=>{
 mode="shorts";
 shorts.classList.add("active");
 youtube.classList.remove("active");
 draw();
};

document.querySelectorAll(".color").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".color").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  theme=btn.dataset.color;
  draw();
 };
});

imageInput.onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 const reader=new FileReader();

 reader.onload=event=>{
  img=new Image();

  img.onload=()=>{
   draw();
  };

  img.src=event.target.result;
 };

 reader.readAsDataURL(file);
};

zoom.oninput=()=>{
 zoomValue.textContent=zoom.value+"%";
 draw();
};

posX.oninput=()=>{
 xValue.textContent=posX.value;
 draw();
};

posY.oninput=()=>{
 yValue.textContent=posY.value;
 draw();
};

title.oninput=draw;
subtitleText.oninput=draw;

function setupCanvas(){

 if(mode==="youtube"){
  canvas.width=1280;
  canvas.height=720;
 }else{
  canvas.width=1080;
  canvas.height=1920;
 }

}

function drawImageCover(){

 if(!img)return;

 const scaleBase=Math.max(
  canvas.width/img.width,
  canvas.height/img.height
 );

 const scale=
 scaleBase*(Number(zoom.value)/100);

 const w=img.width*scale;
 const h=img.height*scale;

 const offsetX=(Number(posX.value)/100)*(canvas.width*.30);
 const offsetY=(Number(posY.value)/100)*(canvas.height*.30);

 const x=(canvas.width-w)/2+offsetX;
 const y=(canvas.height-h)/2+offsetY;

 ctx.drawImage(img,x,y,w,h);

}

function addEffects(){

 const t=themes[theme];

 const gradient=ctx.createLinearGradient(
 0,0,0,canvas.height
 );

 gradient.addColorStop(0,"rgba(0,0,0,.05)");
 gradient.addColorStop(.52,"rgba(0,0,0,.05)");
 gradient.addColorStop(1,"rgba(0,0,0,.82)");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,canvas.width,canvas.height);

 const glow=ctx.createRadialGradient(
 canvas.width*.5,
 canvas.height*.48,
 10,
 canvas.width*.5,
 canvas.height*.48,
 canvas.width*.7
 );

 glow.addColorStop(0,t.glow+"44");
 glow.addColorStop(1,"rgba(0,0,0,0)");

 ctx.fillStyle=glow;
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle=t.main;
 ctx.fillRect(
 0,
 canvas.height-18,
 canvas.width,
 18
 );

}

function fitFont(text,maxWidth,startSize){

 let size=startSize;

 while(size>30){

  ctx.font=`900 ${size}px Arial`;

  if(ctx.measureText(text).width<=maxWidth)
   break;

  size-=4;
 }

 return size;
}

function drawText(){

 const t=themes[theme];

 let main=title.value.trim();
 let sub=subtitleText.value.trim();

 if(!main)main="1 V 4!";

 let maxWidth;
 let fontSize;
 let y;

 if(mode==="youtube"){

  maxWidth=canvas.width*.88;
  fontSize=fitFont(main,maxWidth,135);
  y=canvas.height*.77;

 }else{

  maxWidth=canvas.width*.86;
  fontSize=fitFont(main,maxWidth,155);
  y=canvas.height*.77;

 }

 ctx.textAlign="center";
 ctx.textBaseline="middle";

 ctx.font=`900 ${fontSize}px Arial`;

 ctx.lineWidth=Math.max(9,fontSize*.10);
 ctx.strokeStyle="#000";

 ctx.shadowColor="#000";
 ctx.shadowBlur=18;

 ctx.strokeText(
 main,
 canvas.width/2,
 y
 );

 ctx.fillStyle=t.main;

 ctx.shadowColor=t.glow;
 ctx.shadowBlur=35;

 ctx.fillText(
 main,
 canvas.width/2,
 y
 );

 ctx.shadowBlur=0;

 if(sub){

  let subSize=
  mode==="youtube"?55:62;

  subSize=fitFont(
   sub,
   canvas.width*.82,
   subSize
  );

  const subY=y+fontSize*.82;

  ctx.font=`900 ${subSize}px Arial`;

  ctx.lineWidth=8;
  ctx.strokeStyle="#000";
  ctx.strokeText(
   sub,
   canvas.width/2,
   subY
  );

  ctx.fillStyle="#fff";
  ctx.fillText(
   sub,
   canvas.width/2,
   subY
  );

 }

}

function placeholder(){

 const grad=ctx.createLinearGradient(
 0,0,
 canvas.width,
 canvas.height
 );

 grad.addColorStop(0,"#141c2e");
 grad.addColorStop(1,"#05070c");

 ctx.fillStyle=grad;
 ctx.fillRect(
 0,0,
 canvas.width,
 canvas.height
 );

 ctx.textAlign="center";
 ctx.fillStyle="#677188";

 ctx.font=
 mode==="youtube"
 ? "bold 45px Arial"
 : "bold 58px Arial";

 ctx.fillText(
 "CODM GÖRSELİ YÜKLE",
 canvas.width/2,
 canvas.height/2
 );

}

function draw(){

 setupCanvas();

 ctx.clearRect(
 0,0,
 canvas.width,
 canvas.height
 );

 if(img){
  drawImageCover();
 }else{
  placeholder();
 }

 addEffects();
 drawText();

}

document.getElementById("generate").onclick=()=>{

 if(!img){
  alert("Önce bir oyun görseli yükle.");
  return;
 }

 draw();

 document.getElementById("download").style.display="block";

 canvas.scrollIntoView({
  behavior:"smooth",
  block:"center"
 });

};

document.getElementById("download").onclick=()=>{

 draw();

 const link=document.createElement("a");

 link.download=
 mode==="youtube"
 ? "CrazyTurk-YouTube-Thumbnail.png"
 : "CrazyTurk-Shorts-Cover.png";

 link.href=canvas.toDataURL("image/png");

 link.click();

};

draw();

</script>

</body>
</html>
